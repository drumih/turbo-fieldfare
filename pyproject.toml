[tool.ruff]
# Python here is test and glue code: the benchmark harnesses, the converter
# scripts and the shell-adjacent helpers. One pinned configuration, so a rule
# cannot be forgotten and a script cannot quietly opt out.
# The floor the scripts must run on, and the version CI installs. It is NOT
# "whatever this Mac has" (3.14.7 locally): targeting 3.14 lets ruff format
# rewrite `except (A, B):` into PEP 758's `except A, B:`, which is a syntax
# error on anything older. 3.13 keeps one code image for every supported
# interpreter.
target-version = "py313"
line-length = 100
# Build output only. Nothing under these is project source: `.build` is SwiftPM's
# checkout directory (vendored packages) and `models/` is the 244 GB model store.
extend-exclude = [".build", "models"]

[tool.ruff.lint]
# E4/E7/E9 and F are the correctness core (imports, statements, undefined
# names); W is whitespace-level syntax. The rest cover the pitfalls the audit
# standard names, one family each, as measured by the 2026 pre-production
# audit (its ledger was removed after retention, commit 92566b7a):
#   B      flake8-bugbear — loop-variable capture (B023), mutable defaults (B006),
#          zip without strict (B905), useless expressions (B018)
#   E722   bare `except:`
#   S101   `assert` used for validation
#   F632   `is` compared against a literal
#   PT     flake8-pytest-style (see the two exclusions below)
#   DTZ    flake8-datetimez — `datetime.now()` without a timezone (DTZ005)
#   ASYNC  flake8-async — `time.sleep()` used to wait inside an async function
#          (ASYNC110) and a non-constant sleep argument (ASYNC116)
#   PLW1510 flake8-pylint — `subprocess.run` with no `check` argument at all. It
#          enforces that the choice is *stated*, not that it is True: the probes
#          here read the exit status on purpose (`pgrep` exits 1 for "no match"),
#          so they say `check=False` and the omission is what the rule catches.
#   PLW1514 pylint — text-mode `open`/`read_text`/`write_text` with no `encoding`,
#          whose fix is `encoding="utf-8"`.
#
# Two of the nine named pitfalls are still a human check, and this is the place
# that says so rather than a comment that implies otherwise: a test body that
# asserts nothing has no rule in any ruff family, and `time.sleep()` in
# synchronous code is not what ASYNC110 sees (it is an async-function rule, and
# this tree has no async functions — so the family is enabled for the day it
# gains one). `time.strftime()` and `time.localtime()` are also outside DTZ,
# which reads `datetime`; a naive local stamp through those is not caught.
#
# `preview` is required for PLW1514 and nothing else here. It is safe because
# ruff is pinned: the gate names the version and fails when another is on PATH,
# so the preview rule set cannot drift under this file. Measured on the pinned
# 0.16.7, enabling preview adds no violation beyond PLW1514 itself, so every
# rule family listed above is exactly as strict as it was.
select = ["E4", "E7", "E9", "F", "W", "B", "E722", "S101", "PT", "DTZ", "ASYNC", "PLW1510", "PLW1514"]
preview = true

ignore = [
    # PT009 wants every unittest assertion rewritten as a bare `assert`. This
    # suite is unittest-based on purpose (`python3 -m unittest discover` is how
    # CI runs it) and S101 above is enabled, so PT009 contradicts both the
    # framework in use and the rule next to it. Excluding it is the documented
    # decision; the rest of PT stays.
    "PT009",
    # PT027 wants `self.assertRaises` rewritten as `pytest.raises`; same reason,
    # this suite is unittest and `assertRaises` is the framework's own API.
    "PT027",
]

[tool.ruff.lint.per-file-ignores]
# No per-file escapes: a rule that is wrong for a file is fixed as its own
# ledger task, not silenced here.

[tool.ruff.format]
# The tree is formatted with `ruff format`; quote style is left at ruff's
# default (double) and no docstring code formatting is applied, because the
# scripts carry shell and JSON snippets in docstrings.
docstring-code-format = false
