# gitleaks configuration.
#
# The bundled ruleset is kept (`useDefault = true`), because the scan's value is
# the community rule set; this file only records the identifiers that rule fires
# on and that are provably not credentials, by exact value. Nothing here disables
# a rule and nothing excludes a path: the scanner still reads every commit and
# every file, so a real credential in any of these files is still caught.
#
# The first three entries were found by the full-history scan on 2026-09-25
# (1,035 commits, ~14.3 MB) and each was read before being recorded:
#   * `gotchas/ferry`             — a memory-scope key in a test's stub engine
#   * `characters/halvorsen/eyes` — a memory key in a test fixture (historical path)
#   * `ornith-1.5-35b-a3b`        — a model identifier in a benchmark script
# The fourth was found by the scan on 2026-10-16 (1,695 commits, 28.29 MB):
#   * `expert_misses=37724`       — an engine counter quoted in a measurement doc,
#     the same value pinned by `ENGINE_READ_MISSES_PER_TOKEN` in
#     `benchmark/test_continuous_feeder_sim.py`, which divides it by the token
#     count of the run that produced it.
# The next two were found by the scan on 2026-10-28 (2,254 commits), when the
# bf16-dense Ornith row added its catalogue key and its tests:
#   * `ornith-1.5_35B_A3B-bf16dense` — the runtime stem in the launcher tests
#   * `ornith15-bf16dense`           — the installer key in the catalogue
# The seventh was found by the CI scan on 2026-11-10 (commit e83df77d):
#   * `presence_penalty=0`        — a sampling parameter quoted in
#     `docs/qwen38-mtp-investigation-2026-11-09.md`, the run's own setting
# All seven are matched by `generic-api-key` only because they look like long
# opaque tokens. The values are literal, not shape-based, so no future secret
# that happens to be shaped like a path, a model id or a counter is hidden.

[extend]
useDefault = true

[[allowlists]]
description = "Benign identifiers matched by generic-api-key (see the file header)."
regexTarget = "secret"
regexes = [
  '''^gotchas/ferry$''',
  '''^characters/halvorsen/eyes$''',
  '''^ornith-1\.5-35b-a3b$''',
  '''^expert_misses=37724$''',
  '''^ornith-1\.5_35B_A3B-bf16dense$''',
  '''^ornith15-bf16dense$''',
  '''^presence_penalty=0$''',
]
