        # figure rule, ours included -- a rate only when the token parses to a finite
        # number, and the refusal quotes it exactly as printed -- because one engine
        # refusing a figure and another publishing it as a rate is the asymmetry that
        # file's own header warns about. `main()` ended on `return 0` whatever it
        # measured, so a sweep where every cell failed and a sweep where every
        # selected engine was skipped both printed a table of dashes and exited 0
        # beside the claim; it now answers 0 every cell measured, 1 a named cell has
        # no rate, 2 NOT MEASURED. It drives the real `main()` and the real runners
        # with only the process, the socket and the log patched, so no model, no
        # engine binary, no third-party server and nothing fetched.
        # `test_side_engine_recall_verdict` is AUD-288, the same shape in the driver
        # that decides whether a T7 judgement is worth 15.2 s. Its side-engine column
        # was built from `(completion or "").upper().startswith("YES")`, so a run whose
        # engine answered nothing scored as one that answered NO to everything -- a dead
        # engine read as a wrong one -- and a group that left facts out ranked them the
        # same way; the rates divided by however many questions survived, so an empty
        # file printed `recall@1 0/0` twice and exited 0, and an unreadable file exited 1,
        # the status a contested comparison carries. It now answers 0 every fair question
        # answered in full, 1 a named question ran nothing / left facts unanswered / carried
        # silent rows, 2 NOT MEASURED. Fixture `done.jsonl` files only: no model, no
        # server, no engine binary and nothing fetched.
        # `test_side_engine_wired_verdict` is AUD-289, the same shape in the driver that
        # scores the 12 wired duplication and contradiction cases. It had no refusal path
        # at all: `failures = 0` over an empty by-task map *is* its pass status, so a file
        # with no rows printed a bare header and exited 0; totals were built from whatever
        # rows arrived, so a task that never ran answered `T5: 8/8` and a group that died
        # mid-case answered `T5: 5/5`; a blank completion printed MISS and still entered
        # the denominator, a resumed run's duplicate row was judged twice, and a foreign
        # jsonl's rows were scored against truths this file never authored. A missing path,
        # a half-written line and a row with no prompt each escaped as a traceback at exit
        # 1, the status a contested comparison carries, and a genuine disagreement answered
        # 2, the code reserved for NOT MEASURED. It now answers from the 12 cases the
        # driver itself prepared: 0 every case ran and matched, 1 a named case ran nothing
        # / carried no judgement / was answered twice / came from elsewhere / disagreed,
        # 2 NOT MEASURED. Fixtures only: no model, no server, no engine binary and nothing
        # fetched.
        # `test_side_engine_judges_verdict` is AUD-291, the same shape in the driver that
        # runs one judge over the 60 authored side-engine cases. Its verdict was the
        # negation of a coverage check: `1 if any(entry['refused'] ...) else 0` over a done
        # file that holds no rows is False, so a judge that wrote nothing answered 0 -- and
        # the same run printed `measured nothing: every request refused`, naming refusals
        # when zero requests ran, so the message and the status disagreed about what had
        # happened. Two answered rows of a 60-case run also answered 0: the job count reached
        # the s/judgement rate but never the verdict. A missing done file raised
        # `FileNotFoundError`, a half-written line `JSONDecodeError`, and a row with a task
        # but no prompt `KeyError` out of the shared truth table -- each leaving exit 1, the
        # status a contested comparison carries. It now answers 0 every job ran and was
        # judged; 1 a named task ran no rows, or the rows scored do not cover the jobs the
        # driver was handed, naming how many are missing or repeated; 2 NOT MEASURED, with
        # the reason printed and no rates. Fixtures only: no model, no server, no engine
        # binary and nothing fetched.
        # `test_watchdog_calibrate_verdict` is AUD-292, the threshold calibration for the
        # server's own watchdogs. It counted false positives for the loop and stub rules and
        # answered 0 -- while the stub rule's own row printed `no corpus`, because an empty
        # exchange corpus can never trip it; a calibration that had applied one of its two
        # rules was indistinguishable from one that applied both. The ping-pong rule was not
        # in the verdict at all, so a recorded conversation that tripped it, or a corpus that
        # was not there, answered 0 either way. It answers 0 the three rules ran on their
        # corpora and tripped nothing, 1 it ran and a watchdog fired on a reply that
        # completed, and 2 the calibration did not get to run -- no replies, or a rule that
        # saw no corpus, naming which -- a trip outranking the incomplete note. Those are the
        # codes the rest of the directory answers, which is AUD-293: the calibration used to
        # run them the other way round, so 2 read as a measured disagreement here and as NOT
        # MEASURED in every driver beside it. Corpora are in-memory fixtures: no model, no
        # server, no log tree and nothing fetched.
        # `test_ane_sidecars_gate` is AUD-294, the sidecar gate `tools/ane_sidecars.sh`
        # runs over `models/`. It walked the directory, found no install -- an empty
        # models dir, one whose subdirectories hold no manifest, one that does not exist,
        # and `--verify-only` over the first -- and printed `verified: 0` with exit 0, the
        # same answer as every sidecar verified. That is the shape of a fresh clone, and
        # docs/adding-a-model.md names this script as the step that gates an install. It
        # now refuses at 2, the code it already answers for a usage refusal, naming the
        # directory; a directory whose installs are all skipped families still answers 0
        # with the reason, because those were asked about. The interpreter is a stub that
        # reads a manifest and writes a marker file: no coremltools, no model, no export
        # and nothing fetched.
        # `test_python_resolver_gate` is AUD-295, the interpreter choice in
        # `tools/lib/python.sh`. The library tests every candidate it searches for --
        # version floor and the numpy/ml_dtypes/safetensors import -- and returns the
        # first that passes, but an operator's `TINYTITAN_PYTHON` came back at status 0
        # without being asked anything: a path that does not exist, an interpreter below
        # the floor, one with no analysis stack, and a plain directory all resolved. That
        # is the one value chosen without a check, and `tools/install_models.sh` hands it
        # straight to `"$python" tools/prepare_*.py`, so a typo arrived as a raw
        # "command not found" mid-install. It is now held to the same test, refused with
        # the value and the reason named, and the search's refusal lists every candidate
        # it tried -- the line used to omit `python`, which the loop does try and can
        # select. Stubs in a temp directory run the library's own probe; no install,
        # nothing fetched.
        # test_flat_pair_cache_sim replays a TINYTITAN_ROUTE_TRACE capture under
        # three expert-cache policies -- the uniform control, a flat (layer,
        # expert) pair pool and heat-proportional per-layer allocation -- offline
        # over a trace file handed to it (stage 0 of docs/plan-qwen38-decode-12gb.md);
        # it starts no server, loads no model and imports nothing outside stdlib.
        # test_continuous_feeder_sim models a speculative weight feeder on the
        # same trace shape: one serial drive, the engine's own LFU placement, and
        # a gate that withholds every projected rate when the burst control arm
        # cannot reproduce a measured clock. Model-free, stdlib-only.
        # test_heat_split_sim screens a heat-proportional per-layer slot split
        # across three committed route captures, and pins that a split learned on
        # one session still beats the shipped uniform split on another. It reads
        # only committed .gz traces, starts no server and imports nothing beyond
        # stdlib and its sibling simulator (stage 0 / B1 of
        # docs/plan-qwen38-decode-12gb.md).
        # test_predictive_feeder_sim screens the operator's constant-feeder premise
        # in the three cache shapes it could take -- pinning a learned prefix,
        # biasing eviction by heat, and protecting this session's own next W
        # tokens -- and it holds the pre-registered bars that decide it, including
        # the one disclosed rewrite in §5aa. Committed .gz traces only, no server,
        # no model, no token rate.
        # test_tinytitan_usecap_ab holds the paired A/B *driver* for the saturating
        # expert use-count cap: the arms interleave round-major so machine drift
        # cancels in the paired difference, fewer than two complete pairs refuse
        # rather than average, a baseline hash that answers differently is a
        # correctness finding that outranks the clock, and a busy guard returns 3
        # instead of starting a second model process. It patches the spawn, so it
        # runs no server, loads no model and needs no install.
        # test_tinytitan_price_pair ships §5at's two-price solve. It pins the
        # (dissued, -dadopted) sign to the equation E1 whose published prices are
        # only reproducible that way, takes the last table of the sweep's cumulative
        # page, steps over the zero row the drift control leaves, and bounds its own
        # answer by the digits the page carries: two decimals on `tok/s` move `y` by
        # 0.03 ms on the campaign's own trio, which is why the same three arms solve
        # 1.598 and 1.585 off two pages. A band call inside that bound is refused,
        # not decided. Fixtures are built by the sweep's real `table()`, so reader
        # and printer cannot drift apart; no model, no server, nothing fetched.
        # test_tinytitan_round_budget asks whether *pooling* rounds can settle what
        # one page cannot, and prices three provences on the same pool: the shipped
        # median/widest (distribution-free), mean/triangle (|mean(z_r)-z| <=
        # mean(b_r), so it converges on the average bound and never on zero), and
        # mean/t*sd/sqrt(n) — the only budget that shrinks, and the one that has to
        # earn its independence assumption from the pool's own re-measured baselines.
        # It refuses that licence when a round never sampled its drift, when the
        # signs are unanimous, at fewer than three rounds, and when the drift's net
        # step is wider than its own spread — while a drift measured at exactly zero
        # in every round licenses it, because §5as's measured zero is not silence.
        # The shrinking rule then refuses itself if the pool's *prices* repeat, since
        # t*0/sqrt(n) is the absence of a measurement dressed as the tightest bound.
        # §5ax's two clean rounds are the fixture, so the headline answer — no
        # distribution-free pooling settles that band, and the shrinking rule is not
        # licensed by them — is measured, not asserted. Fixtures are the sweep's own
        # `table()` and the markdown §5ax was published in; no model, no server,
        # nothing fetched.
        # test_tinytitan_gpu_contention pins the host-relative GPU contention gauge
        # §5bd came out of: the shipped preflight refuses a fixed 15 % device
        # utilisation, which this Mac has never satisfied (measured idle floor
        # 56-68 %), so the gauge reads the floor beside the run and grades the run
        # against the floor's own spread instead of an absolute zero the host never
        # had. It pins that a run inside the floor band is `indistinguishable` and
        # not clean, that a side with too few samples is `unreadable` and cannot
        # pass, and that the operator's load command is split into argv rather than
        # handed to a shell. Fixtures are the shapes the real `ioreg` reader
        # returned, including the 0 that lands after a load stops; nothing here
        # calls `ioreg`, loads a model, or needs macOS.
        # test_tinytitan_host_path_split answers §5w's open seam -- the
        # `shared_expert -> moe_phase1_*` GPU idle -- from one arm's own footer,
        # by scope rather than by name. `body - wait - io` is the host time
        # inside a layer iteration that is not a blocked wait, and holds five
        # counters; `wall - body` is the envelope for the eight the runner
        # accumulates once per token, outside `decodeLayerLoop`
        # (+Decode.swift:214). Summing the two gives the absolute bound: every
        # millisecond that is not a wait. The test pins both identities at ~89%
        # named coverage, because the first draft put `pre_ms` and `gather_ms`
        # into the per-layer envelope and read the resulting over-count as
        # overlap -- a scope error that only two envelopes can show. It refuses
        # a page with no footer (the bound would silently narrow, and the old
        # code divided by `None`), a body longer than its token, and reports an
        # unclassified counter rather than dropping it. Fixture is one real
        # 512-token capture arm; no model, no server, nothing fetched.
        # `test_hot_experts` joined on 2026-10-20: 3 tests in 0.15 s, stdlib-only,
        # running the tiered repacker's profile generator over a synthetic trace
        # in a temp directory. It is registered here because it was committed in
        # b24d12f with no CI step naming it, so it ran on one laptop only.
        run: |
          cd benchmark
          python3 -m unittest test_internal_speeds test_quant_perplexity_ab \
            test_side_engine_judges test_side_engine_judges_verdict \
            test_watchdog_calibrate_verdict test_ane_sidecars_gate \
            test_python_resolver_gate \
            test_tinytitan_prefetch_trace_analysis \
            test_memory_master test_memory_scenarios test_memval_master_exit \
            test_ornith_concise_tool_ab test_ornith_four_program_matrix \
            test_ane_prefill_ab_matrix test_ane_prefill_correctness \
            test_quant_quality_ab_exit test_docs_facts_suites test_memory_mini_report \
            test_docs_facts_gate_names \
            test_tsan_storm_exit test_memory_command_names \
            test_driver_documented_commands test_capital_of_paris_report \
            test_tinytitan_determinism_ab test_tinytitan_overlap_measure \
            test_tinytitan_rdadvise_ab test_tinytitan_gap_bisect \
            test_capital_of_paris_smartness test_tinytitan_maxthroughput \
            test_tinytitan_slots_ab test_tinytitan_longgen \
            test_tinytitan_benchmark test_tinytitan_longctx test_memory_smoke \
            test_tinytitan_3bit_probe test_tinytitan_ane_attention_probe \
            test_tinytitan_ane_realweight_rehearsal \
            test_tinytitan_m5_sweep test_memory_reports \
            test_run_stamp_is_utc test_concurrent_sessions_verdict \
            test_mtp_phases_verdict test_sweep_driver_verdicts \
            test_draft_coverage_replay test_verify_identity_bisect \
            test_t28_distinct_expert_estimator \
            test_sampler_ab_verdict test_logged_metric_cells \
            test_knob_sweep_verdict test_guard_source_rate_verdict \
            test_composite_split_verdict test_side_engine_recall_verdict \
            test_side_engine_wired_verdict \
            test_hit_fixup_ab_verdict test_io_backend_ab_verdict \
            test_v42_control_plane_ab_verdict test_vs_competitors_verdict \
            test_flat_pair_cache_sim test_continuous_feeder_sim \
            test_heat_split_sim test_predictive_feeder_sim test_hot_experts \
            test_tinytitan_usecap_ab test_tinytitan_price_pair \
            test_tinytitan_round_budget test_tinytitan_gpu_contention \
            test_tinytitan_host_path_split \
            test_quality_floor test_tinytitan_bench_compare
      - name: T6 reply-check labels and the gate scorer
        # The reply-check measurement is only as good as its labels, and every
        # label comes from a detector a hand review already corrected. These
        # tests pin the traps that cost a wrong label (a negation, a
        # possessive, a rumour, the weather's weekday) and the gate's own
        # arithmetic. No model, no server, no dependencies.
        run: |
          cd benchmark
          python3 -m unittest test_t6_prose_cases
      - name: Run serial tests
        # `swift test` implicitly performs its own DEBUG build, which also
        # produces the `.build/debug/TinyTitanRepack` binary that RepackCLITests
        # spawns — no separate debug build step is needed. `--enable-code-coverage`
        # rides the same run rather than paying for a second one. What that run
        # leaves under `<bin-path>/codecov/` is *not* a package-wide report: on
        # this toolchain the JSON SwiftPM writes there names a single test bundle
        # (27 files, 503 functions, 4,095/4,256 lines) while the merged
        # `default.profdata` beside it holds 11,984 functions, so the next step
        # does the merge itself rather than uploading whatever landed. AUD2-031.
        run: swift test --no-parallel --enable-code-coverage
      - name: Export one merged coverage report for the package
        # Runs immediately after the suite, before anything rebuilds: llvm-cov
        # silently drops an object newer than the profile ("no coverage data
        # found"), which would export a short report that still parses. The script
        # refuses that, takes its object list from `swift package dump-package`
        # rather than globbing a build directory that carries stale bundles from
        # removed products, and then proves the report is package-wide by
        # exporting each bundle alone and requiring the merged file set to strictly
        # contain every one of them.
        run: tools/coverage-export.sh
      - name: Upload the coverage report as an artifact (not a gate)
        # The operator's 2026-10-11 call: coverage is a signal to read, not a
        # wall to hit, so nothing here asserts a threshold — a threshold with no
        # baseline is a number invented to be failed. What *is* checked, in the
        # step above, is that the artifact describes the whole package; the
        # artifact line here just keeps a run that wrote no report from reading
        # as a pass, the same discipline every gate applies to a scan that
        # read nothing.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-code-coverage
          path: .build/package-code-coverage.json
          if-no-files-found: error
      - name: Check Markdown links
        run: |
          ruby - <<'RUBY'
          require 'set'
          Encoding.default_external = Encoding::UTF_8
          Encoding.default_internal = Encoding::UTF_8
          root = ENV.fetch('GITHUB_WORKSPACE', Dir.pwd)
          failures = 0
          checked = 0
          # The scanner works on raw lines, so a bracketed Swift initializer inside
          # a code span -- `[UInt64](repeating: 0, count: n)` -- matches the link
          # pattern and gets reported as a broken link, and a fenced example block is
          # scanned as prose. Neither is a link: in CommonMark a code span is literal
          # text, and so is everything inside a fence. Both are dropped before
          # matching. No real link is skipped -- an unmatched backtick leaves the rest
          # of the line scannable, and only paired spans are removed. (AUD2-051)
          Dir.glob(File.join(root, '**', '*.md')).sort.each do |file|
            # Build output, the model store and installed dependencies are not
            # project docs. `node_modules` matters now that the JS toolchain is
            # installed before this step: a vendored package README is full of
            # links that are relative to its own repo, not to this one.
            next if file.include?('/.build/') || file.include?('/.qwen/') ||
                    file.include?('/node_modules/')
            dir = File.dirname(file)
            fence = nil
            File.readlines(file).each_with_index do |raw, index|
              marker = raw.lstrip
              if fence
                fence = nil if marker.start_with?(fence)
                next
              end
              if marker.start_with?('```')
                fence = '```'
                next
              elsif marker.start_with?('~~~')
                fence = '~~~'
                next
              end
              line = raw.gsub(/(`+)(?:(?!\1).)*?\1/m, ' ')
              line.scan(/\[[^\]]*\]\(([^)]+)\)/) do |match|
                target = match[0].strip
                next if target.empty?
                next if target.start_with?('http://', 'https://', '#', 'mailto:')
                target = target.split('#').first.to_s.gsub('%20', ' ')
                next if target.empty?
                path = File.expand_path(target, dir)
                checked += 1
                next if File.exist?(path)
                puts "#{file.delete_prefix(root + '/')}:#{index + 1}: broken link '#{target}'"
                failures += 1
              end
            end
          end
          puts "Checked #{checked} local link(s); #{failures} broken."
          exit(failures.zero? ? 0 : 1)
          RUBY

  # Separate job: the instrumented build plus the ~3.5x slower suite would
  # roughly double the main job's wall time, and its feedback is orthogonal to
  # a functional failure. Runs in parallel with `test`.
  thread-sanitizer:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    env:
      # Exactly one suppression, scoped to the **top frame**: a Swift-concurrency
      # happens-before TSan does not model, reproduced under load on 2026-09-18.
      # `tools/tsan-suppressions.txt` carries the report, the reproduction and the
      # argument that the racy block is the drainer task's own frame rather than
      # `SSEOutbox` (whose fields are all lock-guarded). Anything in TinyTitan code
      # still has a TinyTitan top frame, so a real race still fails this job.
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run serial tests under ThreadSanitizer
        run: swift test --no-parallel --sanitize=thread

  # Separate job: the three supply-chain gates are independent of the Swift
  # build and orthogonal to a functional failure, so they run beside `test`
  # rather than stretching it — the same reasoning that gave thread-sanitizer
  # its own job. Nothing here builds Swift, loads a model or starts a server.
  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history because the secret scan is only as good as the history
          # it walks: a shallow clone would scan the tip and miss every commit
          # before it. 1643 commits / 27.7 MB of diff measured 2.5 s locally.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Secret scan (gitleaks 8.30.1, full history)
        # Pinned release binary, the same install pattern the shellcheck and
        # swiftlint steps use. `gitleaks detect` walks every commit this
        # checkout carries and exits 1 on a finding, so the job is red the day
        # a secret lands. Verified clean over this history on 2026-10-11
        # before the job was added: no leaks found.
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose
      - name: Python dependency audit (pip-audit 2.10.1)
        # Audits the one requirements file this repository carries — the same
        # pins the converter gate installs — and `benchmark/requirements.txt`'s
        # own header names this run and the version. A new CVE against a pin
        # fails here until the pin moves, which is the point.
        run: |
          python3 -m pip install --user --disable-pip-version-check --quiet pip-audit==2.10.1
          # GITHUB_PATH reaches only later steps, so the binary is called
          # through the same path it was installed to: the first run failed
          # with exit 127 "pip-audit: command not found" on the line below.
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          pip-audit -r benchmark/requirements.txt
      - name: Node dependency audit (npm audit over the plugin lockfiles)
        # Both plugin packages' lockfiles are the pins `npm ci` enforces in the
        # test job; `npm audit` reads them without an install (verified against
        # a directory holding only the two files) and fails on any advisory at
        # or above its default level. Dev-only advisories fail too — a plugin
        # bundle ships whole, so its whole tree is the surface.
        run: |
          for plugin in plugins/dsh-*; do
            [ -f "$plugin/package-lock.json" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && npm audit)
            echo "::endgroup::"
          done
