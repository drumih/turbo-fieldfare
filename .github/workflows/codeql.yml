# CodeQL code scanning — advanced setup.
#
# Why this file exists instead of GitHub's default setup: default setup must
# autobuild, and autobuild runs a bare `swift build`, which builds every product
# in Package.swift — the libraries plus TinyTitanServer, TinyTitanCLI,
# TinyTitanBench and more. That run exceeded 14 minutes without
# finishing and had previously failed, which is why Swift was dropped from the
# default-setup language list and the repository showed "Code scanning
# configuration error".
#
# CodeQL for Swift supports only autobuild and manual (there is no "none" mode,
# because the extractor has to observe a real compilation), so advanced setup is
# the only way to control the build.
#
# --arch arm64 is required, not cosmetic. These sources are Apple-silicon code:
# the kernels and attention paths use Float16, which Swift refuses to compile
# for x86_64 with "'Float16' is unavailable in macOS". The macos-26-arm64 runner
# still defaulted to an x86_64 target, which produced 2672 such errors and
# failed the scan. Pinning the architecture makes the same build succeed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

# Let a running scan finish: with cancel-in-progress a burst of pushes can
# supersede every scan before one completes, and a security check that never
# finishes reports nothing.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze swift
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # init and analyze must be the same codeql-action version: a mixed pair is
      # refused at run time ("Loaded a configuration file for version '4.39.0',
      # but running version '4.38.3'"), so bump both lines in one commit. The
      # Dependabot group `codeql-action` in .github/dependabot.yml is what keeps
      # a version PR from splitting the pair again.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          # Kept for the record and for any buildless analysis: it documents
          # why `.build/**` is out of scope, and the init log echoes it. It is
          # *not* what keeps those results out of the scan — see the build step
          # below for the measurement.
          config-file: .github/codeql/codeql-config.yml

      # The build must really happen: this is what the extractor observes.
      # Each target is built explicitly so the scan stays bounded, every one is
      # pinned to arm64 (see the note at the top of this file), and all of them
      # share a scratch path *outside the checkout*.
      #
      # That scratch path is what keeps this repository's dependencies out of
      # the database. The first attempt used the config file's `paths-ignore`,
      # and the action accepted it (the init log echoes `- .build/**`), but the
      # analysis of commit 3839fb0 still reported all eleven
      # `swift-huggingface` path-injection alerts: for a compiled language in
      # manual build mode that switch does not filter results, because the
      # extractor extracts whatever the build compiles. Building elsewhere means
      # the dependency checkouts are never under the analyzed source root, so
      # there is nothing to report and nothing to ignore.
      - name: Build for extraction
        env:
          SCRATCH: ${{ runner.temp }}/tinytitan-codeql-build
        run: |
          echo "--- toolchain ---"
          swift --version
          uname -m
          echo "--- scratch path: $SCRATCH ---"
          # --disable-sandbox, and why it is safe here: SwiftPM evaluates
          # Package.swift through /usr/bin/sandbox-exec, and on this toolchain
          # that binary ships only arm64e slices (verified locally with
          # `lipo -archs /usr/bin/sandbox-exec` -> arm64e arm64e.x1). The
          # `xcode-27` runner's job tree is x86_64 (the x64 Actions runner on
          # arm64 hardware, so `uname -m` prints x86_64), and under CodeQL's
          # tracer, which injects the arm64 libtrace.dylib into every process,
          # that spawn fails with `posix_spawn error: Bad CPU type in executable
          # (86)` before a single target compiles. The sandbox exists to contain
          # a hostile manifest; this repository's own manifest is reviewed, and
          # the alternative is no Swift analysis at all.
          swift build --target TinyTitanFormat --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitanKernelsC --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitan --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target ContinuityCore --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitanRepackCore --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitanServerCore --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          # The first green scan covered 220 of 464 Swift files: the six targets
          # above are the ones that build the server's dependency graph, so the
          # validation references and the memory service (persistent state) were
          # never compiled and therefore never extracted. These three are
          # libraries; the remaining uncovered files are the thin executable
          # `main.swift` entry points and tests.
          swift build --target TinyTitanValidationSupport --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitanMemory --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"
          swift build --target TinyTitanCLICore --arch arm64 --disable-sandbox --scratch-path "$SCRATCH"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
